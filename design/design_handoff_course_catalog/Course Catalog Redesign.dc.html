<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(8px); } }
body { margin:0; }
* { box-sizing: border-box; }
</style>
</helmet>
<div style="min-height:100vh;background:#f2f2f4;background-image:radial-gradient(circle at 74% -10%, rgba(255,255,255,0.9) 0, transparent 32rem);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Pretendard,'Noto Sans KR',system-ui,sans-serif;color:#09090b;padding:0 0 80px;">

  <!-- Top bar -->
  <div style="position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 clamp(20px,4vw,48px);background:rgba(242,242,244,0.72);backdrop-filter:blur(24px) saturate(150%);border-bottom:1px solid rgba(9,9,11,0.1);">
    <div style="display:flex;align-items:center;gap:9px;">
      <div style="width:30px;height:30px;border-radius:10px;background:#0a0a0b;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;">A</div>
      <b style="font-size:15px;letter-spacing:-0.03em;">AIFlow</b>
    </div>
    <div style="display:flex;align-items:center;gap:4px;padding:4px;background:rgba(255,255,255,0.68);border:1px solid rgba(9,9,11,0.1);border-radius:999px;">
      <button style="min-height:32px;padding:0 14px;color:#71717a;background:transparent;border:0;border-radius:999px;cursor:pointer;font-size:12px;font-weight:780;">홈</button>
      <button style="min-height:32px;padding:0 14px;color:#fff;background:#0a0a0b;border:0;border-radius:999px;cursor:pointer;font-size:12px;font-weight:780;">코스</button>
      <button style="min-height:32px;padding:0 14px;color:#71717a;background:transparent;border:0;border-radius:999px;cursor:pointer;font-size:12px;font-weight:780;">책가방</button>
      <button style="min-height:32px;padding:0 14px;color:#71717a;background:transparent;border:0;border-radius:999px;cursor:pointer;font-size:12px;font-weight:780;">소셜</button>
    </div>
    <div style="width:34px;height:34px;border-radius:50%;background:#0a0a0b;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;">김</div>
  </div>

  <div style="width:min(1420px,100%);margin:0 auto;padding:clamp(24px,4vw,48px) clamp(18px,4vw,48px) 0;">

    <!-- Page head -->
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:26px;margin-bottom:24px;flex-wrap:wrap;animation:fade-up 400ms cubic-bezier(.22,1,.36,1);">
      <div style="min-width:0;">
        <span style="display:block;margin-bottom:8px;color:#71717a;font-size:10px;font-weight:900;letter-spacing:0.13em;text-transform:uppercase;">LEARNING PATH</span>
        <h1 style="margin:0;font-size:clamp(32px,3.8vw,56px);line-height:1.02;letter-spacing:-0.055em;">코스</h1>
        <p style="max-width:560px;margin:10px 0 0;color:#71717a;font-size:14px;line-height:1.6;">현재 학습을 이어가거나 내 실력에 맞는 다음 코스를 선택하세요.</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;min-height:64px;padding:12px 20px;background:rgba(255,255,255,0.76);border:1px solid rgba(9,9,11,0.1);border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,0.06);backdrop-filter:blur(20px);">
        <div>
          <span style="display:block;color:#71717a;font-size:8px;font-weight:900;letter-spacing:0.13em;">MY OVR</span>
          <b style="font-size:26px;letter-spacing:-0.05em;">18.6</b>
        </div>
        <span style="color:#71717a;font-size:10px;font-weight:800;padding-bottom:2px;">B Tier</span>
      </div>
    </div>

    <!-- Search + filter dock -->
    <div style="position:sticky;top:76px;z-index:4;display:grid;gap:10px;padding:12px;background:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.85);border-radius:24px;box-shadow:0 14px 40px rgba(0,0,0,0.07);backdrop-filter:blur(26px) saturate(150%);margin-bottom:16px;">
      <div style="display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:46px;padding:4px 5px 4px 15px;background:#f6f6f8;border:1px solid rgba(9,9,11,0.1);border-radius:16px;">
        <span style="color:#71717a;font-size:18px;">⌕</span>
        <input placeholder="코스명, 설명, 태그로 검색" style="width:100%;min-width:0;background:transparent;border:0;outline:0;font-size:13px;font-family:inherit;" />
        <button style="min-height:36px;padding-inline:16px;color:#fff;background:#0a0a0b;border:0;border-radius:12px;font-size:11px;font-weight:850;cursor:pointer;">검색</button>
      </div>
      <div style="display:flex;gap:6px;overflow-x:auto;padding:0 2px 2px;">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
          <button onClick="{{ f.onSelect }}" style="{{ f.style }}">{{ f.label }}</button>
        </sc-for>
      </div>
    </div>

    <!-- Continue learning -->
    <div style="margin-top:14px;padding:24px;background:#fff;border:1px solid rgba(9,9,11,0.1);border-radius:28px;box-shadow:0 14px 44px rgba(0,0,0,0.06);">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;">
        <div>
          <span style="display:block;color:#71717a;font-size:10px;font-weight:900;letter-spacing:0.13em;text-transform:uppercase;">CONTINUE LEARNING</span>
          <h2 style="margin:6px 0 0;font-size:25px;letter-spacing:-0.03em;">이어서 학습</h2>
        </div>
        <button style="min-height:38px;padding:0 16px;background:#f6f6f8;border:1px solid rgba(9,9,11,0.1);border-radius:14px;font-size:12px;font-weight:780;cursor:pointer;">순서 편집</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid rgba(9,9,11,0.1);">
        <sc-for list="{{ resumeCourses }}" as="c" hint-placeholder-count="2">
          <button style="display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:16px;min-height:104px;padding:20px 4px;text-align:left;background:transparent;border:0;border-left:{{ c.borderLeft }};cursor:pointer;">
            <div style="position:relative;width:56px;height:56px;">
              <svg width="56" height="56" viewBox="0 0 56 56" style="transform:rotate(-90deg);">
                <circle cx="28" cy="28" r="24" fill="none" stroke="#ececef" stroke-width="5" />
                <circle cx="28" cy="28" r="24" fill="none" stroke="{{ c.ringColor }}" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{ c.dashArray }}" />
              </svg>
              <span style="position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;">{{ c.percentLabel }}</span>
            </div>
            <span style="min-width:0;">
              <b style="display:block;font-size:16px;font-weight:900;letter-spacing:-0.02em;">{{ c.title }}</b>
              <small style="display:block;margin-top:4px;color:#71717a;font-size:11px;">{{ c.meta }}</small>
            </span>
            <strong style="font-size:11px;font-weight:900;white-space:nowrap;">{{ c.cta }} ›</strong>
          </button>
        </sc-for>
      </div>
    </div>

    <!-- Recommendation -->
    <div style="display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,0.65fr);gap:14px;margin-top:14px;">
      <button onClick="{{ openCourse }}" style="display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;min-height:300px;padding:32px;text-align:left;background:#0a0a0b;color:#fff;border:0;border-radius:28px;box-shadow:0 14px 44px rgba(0,0,0,0.06);cursor:pointer;position:relative;overflow:hidden;">
        <span style="position:absolute;right:-70px;bottom:-130px;width:380px;height:380px;background:radial-gradient(circle, rgba(255,255,255,0.16), transparent 66%);border:1px solid rgba(255,255,255,0.08);border-radius:50%;"></span>
        <span style="position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;">
          <span style="display:block;color:#a8a8ae;font-size:10px;font-weight:900;letter-spacing:0.13em;">BEST MATCH · 91%</span>
          <h2 style="margin:10px 0 0;font-size:clamp(28px,3vw,40px);line-height:1.08;letter-spacing:-0.04em;">다음 코스로<br/>일차함수 완성은 어때요?</h2>
          <p style="margin:14px 0 22px;color:#b9b9c0;font-size:13px;line-height:1.6;max-width:420px;">최근 약점인 그래프 해석과 기울기를 교재·문제·시험 흐름으로 보완합니다.</p>
          <span style="display:flex;flex-wrap:wrap;gap:6px;">
            <span style="padding:5px 9px;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.14);border-radius:999px;font-size:9px;font-weight:800;">목표 OVR 22</span>
            <span style="padding:5px 9px;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.14);border-radius:999px;font-size:9px;font-weight:800;">12강</span>
            <span style="padding:5px 9px;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.14);border-radius:999px;font-size:9px;font-weight:800;">약 3주</span>
            <span style="padding:5px 9px;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.14);border-radius:999px;font-size:9px;font-weight:800;">#함수</span>
          </span>
        </span>
        <span style="position:relative;z-index:1;display:grid;place-items:center;">
          <span style="position:relative;width:180px;height:180px;">
            <svg width="180" height="180" viewBox="0 0 180 180" style="transform:rotate(-90deg);">
              <circle cx="90" cy="90" r="78" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="12" />
              <circle cx="90" cy="90" r="78" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="445 490" />
            </svg>
            <span style="position:absolute;inset:0;display:grid;place-items:center;flex-direction:column;">
              <span style="text-align:center;">
                <strong style="display:block;font-size:44px;font-weight:900;letter-spacing:-0.04em;">91</strong>
                <small style="display:block;margin-top:2px;color:#b9b9c0;font-size:10px;">18.6 → 22.0</small>
              </span>
            </span>
          </span>
        </span>
      </button>

      <aside style="padding:24px;background:#fff;border:1px solid rgba(9,9,11,0.1);border-radius:28px;box-shadow:0 14px 44px rgba(0,0,0,0.06);">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:6px;">
          <div>
            <span style="display:block;color:#71717a;font-size:10px;font-weight:900;letter-spacing:0.13em;">ALTERNATIVES</span>
            <h2 style="margin:6px 0 0;font-size:20px;letter-spacing:-0.03em;">다른 추천</h2>
          </div>
          <button style="min-height:34px;padding:0 12px;background:#f6f6f8;border:1px solid rgba(9,9,11,0.1);border-radius:12px;font-size:11px;font-weight:780;cursor:pointer;">비교</button>
        </div>
        <sc-for list="{{ alternatives }}" as="a" hint-placeholder-count="3">
          <button style="display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:70px;padding:10px 0;color:#09090b;text-align:left;background:transparent;border:0;border-top:1px solid rgba(9,9,11,0.1);cursor:pointer;">
            <span style="display:grid;place-items:center;width:42px;height:42px;background:#f6f6f8;border-radius:14px;font-size:11px;font-weight:900;">{{ a.match }}</span>
            <span style="min-width:0;">
              <b style="display:block;font-size:13px;">{{ a.title }}</b>
              <small style="display:block;margin-top:4px;color:#71717a;font-size:10px;">{{ a.meta }}</small>
            </span>
            <span style="color:#71717a;">›</span>
          </button>
        </sc-for>
      </aside>
    </div>

    <!-- Catalog -->
    <div style="margin-top:32px;padding-top:28px;border-top:1px solid rgba(9,9,11,0.1);">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;">
        <div>
          <span style="display:block;color:#71717a;font-size:10px;font-weight:900;letter-spacing:0.13em;">ALL COURSES</span>
          <h2 style="margin:6px 0 0;font-size:25px;letter-spacing:-0.03em;">전체 코스</h2>
          <p style="margin:6px 0 0;color:#71717a;font-size:11px;">공개 코스와 선생님이 배정한 코스를 함께 표시합니다.</p>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="padding:0 9px;min-height:28px;display:inline-flex;align-items:center;color:#71717a;background:#f6f6f8;border:1px solid rgba(9,9,11,0.1);border-radius:999px;font-size:10px;font-weight:850;">{{ catalogCountLabel }}</span>
          <button style="min-height:34px;padding:0 14px;background:#f6f6f8;border:1px solid rgba(9,9,11,0.1);border-radius:14px;font-size:11px;font-weight:780;cursor:pointer;">추천순 ⌄</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat({{ gridCols }},minmax(0,1fr));border-top:1px solid rgba(9,9,11,0.1);border-left:1px solid rgba(9,9,11,0.1);">
        <sc-for list="{{ catalogCourses }}" as="course" hint-placeholder-count="6">
          <button style="display:flex;min-width:0;min-height:270px;flex-direction:column;padding:22px;color:#09090b;text-align:left;background:rgba(255,255,255,0.7);border:0;border-right:1px solid rgba(9,9,11,0.1);border-bottom:1px solid rgba(9,9,11,0.1);cursor:pointer;">
            <div style="height:6px;width:36px;border-radius:99px;background:{{ course.stripeColor }};margin-bottom:16px;"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span style="display:grid;place-items:center;width:42px;height:42px;background:#f6f6f8;border-radius:14px;font-size:11px;font-weight:900;">{{ course.match }}</span>
              <span style="padding:5px 9px;color:#71717a;background:#f6f6f8;border-radius:999px;font-size:9px;font-weight:750;">{{ course.status }}</span>
            </div>
            <h3 style="margin-top:22px;font-size:20px;letter-spacing:-0.03em;line-height:1.15;">{{ course.title }}</h3>
            <p style="margin:9px 0 16px;color:#71717a;font-size:11px;line-height:1.55;">{{ course.description }}</p>
            <div style="margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;">
              <sc-for list="{{ course.meta }}" as="m" hint-placeholder-count="3">
                <span style="padding:5px 8px;color:#71717a;background:#f6f6f8;border-radius:999px;font-size:9px;font-weight:750;">{{ m }}</span>
              </sc-for>
            </div>
            <span style="margin-top:16px;font-size:11px;font-weight:850;">{{ course.linkLabel }} ›</span>
          </button>
        </sc-for>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;gridColumns&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: 3, &quot;options&quot;: [2, 3], &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;레이아웃&quot;}, &quot;showCompleted&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;레이아웃&quot;}}">

class Component extends DCLogic {
  state = { filter: '전체' };

  filterLabels = ['전체', '수강 중', '추천', '배정됨', '완료 코스'];

  resumeData = [
    { title: '일차함수 완성', meta: '그래프 이해 · 06번째 모듈', progress: 0.42, cta: '이어하기' },
    { title: '도형의 닮음', meta: '닮음비 · 03번째 모듈', progress: 0.18, cta: '열기' },
  ];

  alternativesData = [
    { match: 84, title: '도형의 닮음', meta: '#기하 · 9강 · 2주' },
    { match: 78, title: '확률 실전', meta: '#확률 · 8강 · 자율' },
    { match: 72, title: '수학 기초 회복', meta: '#기초 · 16강 · 4주' },
  ];

  catalogData = [
    { match: 96, title: '중2 함수 마스터', description: '개념부터 시험까지 한 번에 이어지는 선생님 배정 코스', meta: ['배정됨', '14강', '4주'], status: '선생님 배정', linkLabel: '코스 상세', stripe: '#0a0a0b' },
    { match: 88, title: '그래프로 이해하는 함수', description: '좌표와 그래프를 시각적으로 반복 학습합니다.', meta: ['공개', '10강', '2주'], status: '수강 전', linkLabel: '코스 상세', stripe: '#52525b' },
    { match: 82, title: '도형의 닮음 워크숍', description: '닮음 조건과 닮음비를 문제 중심으로 익힙니다.', meta: ['공개', '9강', '2주'], status: '수강 전', linkLabel: '코스 상세', stripe: '#52525b' },
    { match: '—', title: '확률 기초부터 실전까지', description: '경우의 수를 정리하고 실전 문제로 연결합니다.', meta: ['공개', '12강', '자율'], status: '수강 전', linkLabel: '코스 상세', stripe: '#a1a1aa' },
    { match: 100, title: '일차방정식 기초', description: '완료한 코스의 교재와 문제를 다시 확인할 수 있습니다.', meta: ['완료', '8강', '100%'], status: '완료 · 미리보기', linkLabel: '미리보기', stripe: '#71717a' },
    { match: 76, title: '서술형 풀이 훈련', description: '풀이 과정을 단계별로 쓰고 Flow로 분석합니다.', meta: ['공개', '7강', '자율'], status: '수강 전', linkLabel: '코스 상세', stripe: '#52525b' },
  ];

  setFilter(label) {
    this.setState({ filter: label });
  }

  renderVals() {
    const gridCols = this.props.gridColumns ?? 3;
    const showCompleted = this.props.showCompleted ?? true;

    const filters = this.filterLabels.map((label) => {
      const active = label === this.state.filter;
      return {
        label,
        onSelect: () => this.setFilter(label),
        style: `flex:0 0 auto;min-height:32px;padding:0 12px;color:${active ? '#fff' : '#71717a'};background:${active ? '#0a0a0b' : 'transparent'};border:1px solid transparent;border-radius:999px;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;`,
      };
    });

    const resumeCourses = this.resumeData.map((c, i) => {
      const circumference = 2 * Math.PI * 24;
      const dash = circumference * c.progress;
      return {
        title: c.title,
        meta: c.meta,
        cta: c.cta,
        percentLabel: Math.round(c.progress * 100) + '%',
        ringColor: i === 0 ? '#0a0a0b' : '#52525b',
        dashArray: `${dash.toFixed(1)} ${circumference.toFixed(1)}`,
        borderLeft: i === 0 ? 'none' : '1px solid rgba(9,9,11,0.1)',
      };
    });

    const catalogCourses = this.catalogData
      .filter((c) => showCompleted || c.status !== '완료 · 미리보기')
      .map((c) => ({
        ...c,
        stripeColor: c.stripe,
      }));

    return {
      filters,
      resumeCourses,
      alternatives: this.alternativesData,
      catalogCourses,
      gridCols,
      catalogCountLabel: `${catalogCourses.length}개`,
      openCourse: () => {},
    };
  }
}

</script>
</body>
</html>
