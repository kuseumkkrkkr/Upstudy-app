<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통계적 탐구 계획</title><style>body{font:17px/1.6 system-ui;max-width:46rem;margin:auto;padding:1rem}label{display:block;margin:1rem 0}input{width:100%;min-height:2.5rem}strong{color:#1d4ed8}</style><main><h1>통계적 탐구 계획</h1><p>학생 20명의 통학 시간을 조사해 학년별 차이를 알아보려 합니다. 조사 대상, 변수, 수집 방법을 먼저 정하세요.</p><label>조사 대상 학생 수 <input id='v' type='range' min='10' max='40' value='20'></label><p id='out' aria-live='polite'></p><p>학년군 기준 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const v=document.querySelector('#v'),o=document.querySelector('#out');function draw(){o.textContent=`대상 ${v.value}명 · 통학 시간(분)을 같은 요일에 기록하고 응답률과 누락 자료를 함께 점검하세요.`}v.addEventListener('input',draw);draw();</script></html>
