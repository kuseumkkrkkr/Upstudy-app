<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>산점도와 상관관계</title><style>body{font:17px/1.6 system-ui;max-width:46rem;margin:auto;padding:1rem}label{display:block;margin:1rem 0}input{width:100%;min-height:2.5rem}strong{color:#1d4ed8}</style><main><h1>산점도와 상관관계</h1><p>운동 시간이 길수록 달리기 기록 시간이 짧아지는 경향은 산점도에서 어떤 방향일까요?</p><label>산점도 점의 방향 <select id='v'><option value='양'>오른쪽 위</option><option value='음'>오른쪽 아래</option><option value='없음'>뚜렷한 방향 없음</option></select></label><p id='out' aria-live='polite'></p><p>학년군 기준 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const v=document.querySelector('#v'),o=document.querySelector('#out');function draw(){const t=v.value;o.textContent=`${t}의 상관관계입니다. 상관관계만으로 원인과 결과를 단정할 수 없습니다.`}v.addEventListener('change',draw);draw();</script></html>
