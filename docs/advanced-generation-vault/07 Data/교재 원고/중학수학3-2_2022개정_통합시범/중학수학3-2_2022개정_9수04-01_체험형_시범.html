<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자료에 맞는 대푯값</title><style>body{font:17px/1.6 system-ui;max-width:46rem;margin:auto;padding:1rem}label{display:block;margin:1rem 0}input{width:100%;min-height:2.5rem}strong{color:#1d4ed8}</style><main><h1>자료에 맞는 대푯값</h1><p>자료 4,5,5,6,30에서는 평균과 중앙값 중 어느 값이 가운데 자료를 더 잘 나타낼까요?</p><p>자료: 4, 5, 5, 6, <output id='vout'>30</output></p><label>마지막 자료 <input id='v' type='range' min='1' max='30' value='30'></label><p id='out' aria-live='polite'></p><p>학년군 기준 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const v=document.querySelector('#v'),o=document.querySelector('#out');function draw(){const a=[4,5,5,6,+v.value].sort((x,y)=>x-y),mean=a.reduce((x,y)=>x+y,0)/5;document.querySelector('#vout').value=v.value;o.textContent=`평균 ${mean.toFixed(1)} · 중앙값 ${a[2]} · 최빈값 5`}v.addEventListener('input',draw);draw();</script></html>
