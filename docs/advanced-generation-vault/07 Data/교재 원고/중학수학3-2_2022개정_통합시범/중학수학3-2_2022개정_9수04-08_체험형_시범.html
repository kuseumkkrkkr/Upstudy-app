<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상자그림으로 분포 비교</title><style>body{font:17px/1.6 system-ui;max-width:46rem;margin:auto;padding:1rem}label{display:block;margin:1rem 0}input{width:100%;min-height:2.5rem}strong{color:#1d4ed8}</style><main><h1>상자그림으로 분포 비교</h1><p>두 반의 중앙값이 같아도 점수 분포는 다를 수 있습니다. 중앙값과 사분위수를 비교해 보세요.</p><p>다섯 수치 요약: 40, 55, 70, <output id='vout'>80</output>, 95</p><label>제3사분위수 <input id='v' type='range' min='70' max='90' value='80'></label><p id='out' aria-live='polite'></p><p>학년군 기준 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const v=document.querySelector('#v'),o=document.querySelector('#out');function draw(){document.querySelector('#vout').value=v.value;o.textContent=`중앙값 70 · 사분위 범위 ${+v.value-55} · 상자 안 가운데 절반의 폭`}v.addEventListener('input',draw);draw();</script></html>
