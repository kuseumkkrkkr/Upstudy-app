<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제곱근과 무리수의 크기 살펴보기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input{width:100%;min-height:2.5rem}svg{width:min(100%,26rem);height:auto}strong[aria-live]{color:#1d4ed8}</style></head><body><main><h1>제곱근과 무리수의 크기 살펴보기</h1><p>입력 값을 바꾸며 수식과 그림이 어떻게 연결되는지 확인하세요.</p><label for="value">제곱근을 확인할 수 <output id="valueOut">2</output></label><input id="value" type="range" min="1" max="25" value="2"><svg viewBox="0 0 420 80" role="img" aria-label="수직선 위 제곱근 위치"><line x1="30" y1="40" x2="390" y2="40" stroke="currentColor"/><circle id="point" cx="157" cy="40" r="8" fill="#b45309"/></svg><p>√<span id="n"></span> ≈ <strong id="root" aria-live="polite"></strong></p><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const s=document.querySelector('#value');function draw(){const n=+s.value,r=Math.sqrt(n);document.querySelector('#valueOut').value=n;document.querySelector('#n').textContent=n;document.querySelector('#root').textContent=r.toFixed(3);document.querySelector('#point').setAttribute('cx',30+r*60)}s.addEventListener('input',draw);draw();</script></body></html>
