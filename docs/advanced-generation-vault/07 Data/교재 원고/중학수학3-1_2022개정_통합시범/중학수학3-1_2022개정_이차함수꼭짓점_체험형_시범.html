<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이차함수 그래프의 최댓값·최솟값 읽기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input{width:100%;min-height:2.5rem}svg{width:min(100%,26rem);height:auto}strong[aria-live]{color:#1d4ed8}</style></head><body><main><h1>이차함수 그래프의 최댓값·최솟값 읽기</h1><p>입력 값을 바꾸며 수식과 그림이 어떻게 연결되는지 확인하세요.</p><label for="h">꼭짓점의 x좌표 h <output id="hOut">2</output></label><input id="h" type="range" min="-5" max="5" value="2"><label for="k">꼭짓점의 y좌표 k <output id="kOut">5</output></label><input id="k" type="range" min="-5" max="8" value="5"><label for="sign">그래프 방향</label><select id="sign"><option value="-1">아래로 열림</option><option value="1">위로 열림</option></select><svg viewBox="0 0 260 170" role="img" aria-label="꼭짓점을 바꿀 수 있는 포물선"><path d="M35 40Q130 180 225 40" fill="none" stroke="currentColor" stroke-width="3"/><circle id="vertex" cx="130" cy="115" r="6" fill="#b45309"/></svg><p id="extreme" aria-live="polite"></p><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const h=document.querySelector('#h'),k=document.querySelector('#k'),s=document.querySelector('#sign');function draw(){const hv=+h.value,kv=+k.value,down=s.value==='-1';document.querySelector('#hOut').value=hv;document.querySelector('#kOut').value=kv;document.querySelector('#vertex').setAttribute('cx',130+hv*12);document.querySelector('#vertex').setAttribute('cy',100-kv*8);document.querySelector('#extreme').textContent=down?`최댓값 ${kv} (x=${hv})`:`최솟값 ${kv} (x=${hv})`}h.addEventListener('input',draw);k.addEventListener('input',draw);s.addEventListener('change',draw);draw();</script></body></html>
