<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전개의 역으로 다항식 인수분해하기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input{width:100%;min-height:2.5rem}svg{width:min(100%,26rem);height:auto}strong[aria-live]{color:#1d4ed8}</style></head><body><main><h1>전개의 역으로 다항식 인수분해하기</h1><p>입력 값을 바꾸며 수식과 그림이 어떻게 연결되는지 확인하세요.</p><label for="p">첫 인수 상수 p <output id="pOut">3</output></label><input id="p" type="range" min="-8" max="8" value="3"><label for="q">둘째 인수 상수 q <output id="qOut">4</output></label><input id="q" type="range" min="-8" max="8" value="4"><p>전개식: <strong id="form" aria-live="polite"></strong></p><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const p=document.querySelector('#p'),q=document.querySelector('#q');function draw(){const x=+p.value,y=+q.value;document.querySelector('#pOut').value=x;document.querySelector('#qOut').value=y;document.querySelector('#form').textContent=`x² + ${x+y}x + ${x*y}`}p.addEventListener('input',draw);q.addEventListener('input',draw);draw();</script></body></html>
