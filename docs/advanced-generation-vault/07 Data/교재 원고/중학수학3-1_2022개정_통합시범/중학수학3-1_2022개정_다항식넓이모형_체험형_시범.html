<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다항식의 곱셈을 넓이로 설명하기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input{width:100%;min-height:2.5rem}svg{width:min(100%,26rem);height:auto}strong[aria-live]{color:#1d4ed8}</style></head><body><main><h1>다항식의 곱셈을 넓이로 설명하기</h1><p>입력 값을 바꾸며 수식과 그림이 어떻게 연결되는지 확인하세요.</p><label for="a">상수 a <output id="aOut">3</output></label><input id="a" type="range" min="1" max="8" value="3"><label for="b">상수 b <output id="bOut">2</output></label><input id="b" type="range" min="1" max="8" value="2"><p>(x+a)(x+b) = <strong id="expression" aria-live="polite"></strong></p><svg viewBox="0 0 240 150" role="img" aria-label="x와 상수로 나눈 직사각형 넓이 모형"><rect x="25" y="25" width="110" height="90" fill="none" stroke="currentColor"/><path d="M80 25v90M25 70h110" stroke="#b45309"/></svg><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const a=document.querySelector('#a'),b=document.querySelector('#b');function draw(){const x=+a.value,y=+b.value;document.querySelector('#aOut').value=x;document.querySelector('#bOut').value=y;document.querySelector('#expression').textContent=`x² + ${x+y}x + ${x*y}`}a.addEventListener('input',draw);b.addEventListener('input',draw);draw();</script></body></html>
