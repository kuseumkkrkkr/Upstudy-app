<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사각형의 대각선 성질로 관계 설명하기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input,select,button{min-height:2.7rem}input{width:100%}svg{width:min(100%,28rem);height:auto;display:block;margin:1rem auto}output,strong[aria-live]{color:#1d4ed8}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b45309}</style></head><body><main><h1>사각형의 대각선 성질로 관계 설명하기</h1><p>조건을 하나씩 바꾸고 관찰한 결과를 설명해 보세요.</p><section aria-label="직접 조작"><label for="shape">사각형</label><select id="shape"><option>평행사변형</option><option>직사각형</option><option>마름모</option><option>정사각형</option></select><svg viewBox="0 0 240 150" role="img" aria-label="사각형의 두 대각선"><path d="M45 35L190 35 195 115 40 115Z M45 35L195 115 M190 35L40 115" fill="none" stroke="currentColor"/><circle cx="117" cy="75" r="4" fill="#b45309"/></svg><p id="facts" role="status" aria-live="polite"></p><button id="check">성질 확인</button></section><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const s=document.querySelector('#shape'),f=document.querySelector('#facts');function draw(){const v={평행사변형:'두 대각선은 서로를 이등분합니다.',직사각형:'두 대각선은 서로를 이등분하고 길이가 같습니다.',마름모:'두 대각선은 서로를 이등분하고 수직으로 만납니다.',정사각형:'두 대각선은 서로를 이등분하고 길이가 같으며 수직으로 만납니다.'};f.textContent=v[s.value]}s.addEventListener('change',draw);document.querySelector('#check').addEventListener('click',draw);draw();</script></body></html>
