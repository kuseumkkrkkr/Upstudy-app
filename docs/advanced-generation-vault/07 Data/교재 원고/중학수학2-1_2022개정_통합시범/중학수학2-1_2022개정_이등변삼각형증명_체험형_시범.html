<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이등변삼각형의 성질을 정당화하기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input,select,button{min-height:2.7rem}input{width:100%}svg{width:min(100%,28rem);height:auto;display:block;margin:1rem auto}output,strong[aria-live]{color:#1d4ed8}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b45309}</style></head><body><main><h1>이등변삼각형의 성질을 정당화하기</h1><p>조건을 하나씩 바꾸고 관찰한 결과를 설명해 보세요.</p><section aria-label="직접 조작"><label for="base">밑각 <output id="baseOut">50°</output></label><input id="base" type="range" min="10" max="85" value="50"><svg viewBox="0 0 240 170" role="img" aria-label="두 밑각이 같은 이등변삼각형"><path d="M35 140L120 25 205 140Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M120 25L120 140" stroke="#b45309" stroke-dasharray="5 4"/></svg><p>꼭짓각: <strong id="apex" aria-live="polite"></strong></p><label for="guess">꼭짓각을 고르세요</label><select id="guess"><option>70</option><option>80</option><option>90</option></select><button id="check">답 확인</button><p id="feedback" role="status"></p></section><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const b=document.querySelector('#base'),o=document.querySelector('#baseOut'),a=document.querySelector('#apex');function draw(){o.value=b.value+'°';a.textContent=(180-2*Number(b.value))+'°'}b.addEventListener('input',draw);document.querySelector('#check').addEventListener('click',()=>document.querySelector('#feedback').textContent=Number(document.querySelector('#guess').value)===180-2*Number(b.value)?'맞았습니다.':'두 밑각이 같다는 성질과 내각의 합을 확인하세요.');draw();</script></body></html>
