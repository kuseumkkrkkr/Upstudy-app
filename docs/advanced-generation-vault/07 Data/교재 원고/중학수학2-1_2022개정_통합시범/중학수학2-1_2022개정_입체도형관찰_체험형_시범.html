<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입체도형을 여러 방향에서 관찰하기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input,select,button{min-height:2.7rem}input{width:100%}svg{width:min(100%,28rem);height:auto;display:block;margin:1rem auto}output,strong[aria-live]{color:#1d4ed8}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b45309}</style></head><body><main><h1>입체도형을 여러 방향에서 관찰하기</h1><p>조건을 하나씩 바꾸고 관찰한 결과를 설명해 보세요.</p><section aria-label="직접 조작"><label for="solid">입체 모양</label><select id="solid"><option value="cylinder">원기둥</option><option value="cone">원뿔</option><option value="sphere">구</option></select><svg viewBox="0 0 240 160" role="img" aria-label="선택한 회전체의 단면 예시"><ellipse cx="120" cy="35" rx="55" ry="18" fill="none" stroke="currentColor"/><path d="M65 35v90 M175 35v90 M65 125a55 18 0 0 0 110 0" fill="none" stroke="currentColor"/><path id="cut" d="M65 80h110" stroke="#b45309" stroke-width="4"/></svg><p id="result" role="status" aria-live="polite"></p><button id="check">단면 관찰</button></section><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const s=document.querySelector('#solid'),r=document.querySelector('#result'),c=document.querySelector('#cut');function draw(){if(s.value==='cylinder'){r.textContent='축에 수직인 단면은 원, 축을 포함하는 단면은 직사각형입니다.';c.setAttribute('d','M65 80h110')}else if(s.value==='cone'){r.textContent='축에 수직인 단면은 원, 축을 포함하는 단면은 삼각형입니다.';c.setAttribute('d','M65 80L120 25 175 80')}else{r.textContent='중심을 지나는 평면의 단면은 원입니다.';c.setAttribute('d','M65 80a55 55 0 1 0 110 0a55 55 0 1 0 -110 0')}}s.addEventListener('change',draw);document.querySelector('#check').addEventListener('click',draw);draw();</script></body></html>
