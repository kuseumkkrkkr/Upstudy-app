<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상대도수로 크기가 다른 집단 비교하기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input,select,button{min-height:2.7rem}input{width:100%}svg{width:min(100%,28rem);height:auto;display:block;margin:1rem auto}output,strong[aria-live]{color:#1d4ed8}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b45309}</style></head><body><main><h1>상대도수로 크기가 다른 집단 비교하기</h1><p>조건을 하나씩 바꾸고 관찰한 결과를 설명해 보세요.</p><section aria-label="직접 조작"><label for="countA">A집단 전체 인원</label><input id="countA" type="number" min="1" value="20"><label for="hitA">A집단 해당 인원</label><input id="hitA" type="number" min="0" value="12"><label for="countB">B집단 전체 인원</label><input id="countB" type="number" min="1" value="60"><label for="hitB">B집단 해당 인원</label><input id="hitB" type="number" min="0" value="30"><button id="check">상대도수 비교</button><p id="result" role="status" aria-live="polite"></p></section><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const ids=['countA','hitA','countB','hitB'];function draw(){const [a,x,b,y]=ids.map(i=>Number(document.getElementById(i).value));if(a<1||b<1||x<0||y<0||x>a||y>b){document.querySelector('#result').textContent='전체 인원과 해당 인원 범위를 확인하세요.';return}const ra=x/a,rb=y/b;document.querySelector('#result').textContent=`A ${(ra*100).toFixed(1)}%, B ${(rb*100).toFixed(1)}% · ${ra===rb?'같은 비율입니다.':ra>rb?'A의 상대도수가 높습니다.':'B의 상대도수가 높습니다.'}`}ids.forEach(i=>document.getElementById(i).addEventListener('input',draw));document.querySelector('#check').addEventListener('click',draw);draw();</script></body></html>
