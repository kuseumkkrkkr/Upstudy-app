<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다각형의 각과 대각선 탐구</title>
<style>body{font:17px/1.6 system-ui,sans-serif;max-width:46rem;margin:0 auto;padding:1.25rem;color:#172033}fieldset{border:1px solid #94a3b8;border-radius:12px;padding:1rem}label{display:block;margin-top:1rem}input{width:100%;min-height:2.5rem;accent-color:#1d4ed8}button{min-height:2.75rem;padding:.6rem 1rem}svg{display:block;width:min(100%,24rem);height:auto;margin:1rem auto}:focus-visible{outline:3px solid #b45309;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head>
<body data-lesson="ms12-22-polygon-angle-sum"><main><h1>다각형의 각과 대각선 탐구</h1><p>값을 바꾸고 무엇이 달라지며 무엇이 유지되는지 설명해 보세요.</p><fieldset><legend>직접 조작</legend><svg viewBox="0 0 200 180" role="img" aria-label="변의 수를 바꾸는 볼록다각형"><polygon id="poly" fill="none" stroke="currentColor" stroke-width="3"/></svg><label for="sides">변의 수 <output id="nOut">6</output></label><input id="sides" type="range" min="3" max="12" value="6" aria-label="다각형의 변의 수 3에서 12"><p>내각의 합: <strong id="sum" aria-live="polite"></strong></p><p>대각선 수: <strong id="diag" aria-live="polite"></strong></p><label for="guess">내각의 합을 입력하세요 (도)</label><input id="guess" type="number" min="180" max="1800" step="180"><button id="check" type="button">답 확인</button><p id="feedback" role="status"></p></fieldset><section aria-labelledby="quiz"><h2 id="quiz">생각 확인</h2><p>육각형은 내각의 합 720도, 대각선 9개입니다.</p></section><p>기준: 별책 8 성취기준 후보 · 학기 배정 후보 · 교사 검수 대기</p></main><script>const s=document.querySelector('#sides');function draw(){const n=+s.value;document.querySelector('#nOut').value=n;document.querySelector('#sum').textContent=(n-2)*180+'°';document.querySelector('#diag').textContent=n*(n-3)/2+'개';const pts=Array.from({length:n},(_,i)=>{const a=2*Math.PI*i/n-Math.PI/2;return (100+70*Math.cos(a))+','+(85+70*Math.sin(a))}).join(' ');document.querySelector('#poly').setAttribute('points',pts);}s.addEventListener('input',draw);document.querySelector('#check').addEventListener('click',()=>{document.querySelector('#feedback').textContent=(+document.querySelector('#guess').value===(+s.value-2)*180)?'맞았습니다.':'삼각형으로 나누어 보세요.'});draw();</script></body></html>
