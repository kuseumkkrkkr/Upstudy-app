<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자료를 대표하는 값 고르기</title>
<style>body{font:17px/1.6 system-ui,sans-serif;max-width:46rem;margin:0 auto;padding:1.25rem;color:#172033}fieldset{border:1px solid #94a3b8;border-radius:12px;padding:1rem}label{display:block;margin-top:1rem}input{width:100%;min-height:2.5rem;accent-color:#1d4ed8}button{min-height:2.75rem;padding:.6rem 1rem}svg{display:block;width:min(100%,24rem);height:auto;margin:1rem auto}:focus-visible{outline:3px solid #b45309;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head>
<body data-lesson="ms12-22-representative-values"><main><h1>자료를 대표하는 값 고르기</h1><p>값을 바꾸고 무엇이 달라지며 무엇이 유지되는지 설명해 보세요.</p><fieldset><legend>직접 조작</legend><p>자료: 2, 3, 3, 4, <span id="sampleValue">8</span></p><label for="outlier">마지막 자료 <output id="valueOut">8</output></label><input id="outlier" type="range" min="0" max="20" value="8" aria-label="다섯 번째 자료 값 0에서 20"><p>평균: <strong id="mean" aria-live="polite"></strong></p><p>중앙값: <strong id="median" aria-live="polite"></strong></p><p>최빈값: <strong id="mode" aria-live="polite"></strong></p><label for="guess">중앙값은 얼마인가요?</label><input id="guess" type="number" min="0" max="20" step="0.5"><button id="check" type="button">답 확인</button><p id="feedback" role="status"></p></fieldset><section aria-labelledby="quiz"><h2 id="quiz">생각 확인</h2><p>마지막 자료를 20으로 바꾸면 평균은 6.4, 중앙값은 3, 최빈값은 3입니다.</p></section><p>기준: 별책 8 성취기준 후보 · 학기 배정 후보 · 교사 검수 대기</p></main><script>const s=document.querySelector('#outlier');function draw(){const a=[2,3,3,4,+s.value].sort((x,y)=>x-y),mean=a.reduce((x,y)=>x+y,0)/a.length,med=a[2];document.querySelector('#valueOut').value=s.value;document.querySelector('#sampleValue').textContent=s.value;document.querySelector('#mean').textContent=Number.isInteger(mean)?mean:mean.toFixed(2);document.querySelector('#median').textContent=med;document.querySelector('#mode').textContent='3';}s.addEventListener('input',draw);document.querySelector('#check').addEventListener('click',()=>{document.querySelector('#feedback').textContent=(+document.querySelector('#guess').value===+document.querySelector('#median').textContent)?'맞았습니다.':'자료를 크기순으로 놓고 가운데 값을 확인하세요.'});draw();</script></body></html>
