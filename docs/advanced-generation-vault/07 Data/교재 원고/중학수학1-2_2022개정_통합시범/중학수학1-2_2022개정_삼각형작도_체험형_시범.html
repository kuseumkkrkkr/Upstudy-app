<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>조건을 이용해 삼각형 작도하기</title>
<style>body{font:17px/1.6 system-ui,sans-serif;max-width:46rem;margin:0 auto;padding:1.25rem;color:#172033}fieldset{border:1px solid #94a3b8;border-radius:12px;padding:1rem}label{display:block;margin-top:1rem}input{width:100%;min-height:2.5rem;accent-color:#1d4ed8}button{min-height:2.75rem;padding:.6rem 1rem}svg{display:block;width:min(100%,24rem);height:auto;margin:1rem auto}:focus-visible{outline:3px solid #b45309;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head>
<body data-lesson="ms12-22-triangle-construction"><main><h1>조건을 이용해 삼각형 작도하기</h1><p>값을 바꾸고 무엇이 달라지며 무엇이 유지되는지 설명해 보세요.</p><fieldset><legend>직접 조작</legend><p id="triState" role="status"></p><svg viewBox="0 0 220 150" role="img" aria-label="세 변의 길이로 삼각형 작도"><path d="M30 120 L190 120 L105 35 Z" fill="none" stroke="currentColor" stroke-width="3"/></svg><label for="a">변 a <output id="aOut">4</output></label><input id="a" type="range" min="1" max="10" value="4" aria-label="변 a 길이 1에서 10"><label for="b">변 b <output id="bOut">5</output></label><input id="b" type="range" min="1" max="10" value="5" aria-label="변 b 길이 1에서 10"><label for="c">변 c <output id="cOut">7</output></label><input id="c" type="range" min="1" max="10" value="7" aria-label="변 c 길이 1에서 10"><button id="construct" type="button">작도 순서 확인</button><p id="triExplain" aria-live="polite"></p><label for="guess">삼각형을 만들 수 있나요?</label><select id="guess"><option value="yes">가능하다</option><option value="no">불가능하다</option></select><button id="check" type="button">답 확인</button><p id="feedback" role="status"></p></fieldset><section aria-labelledby="quiz"><h2 id="quiz">생각 확인</h2><p>2, 3, 6은 삼각형 부등식을 만족하지 않아 작도할 수 없습니다.</p></section><p>기준: 별책 8 성취기준 후보 · 학기 배정 후보 · 교사 검수 대기</p></main><script>const ids=['a','b','c'];function possible(){const v=ids.map(id=>+document.getElementById(id).value);return v.every((x,i)=>x<v[(i+1)%3]+v[(i+2)%3]);}function draw(){const v=ids.map(id=>+document.getElementById(id).value);ids.forEach((id,i)=>document.getElementById(id+'Out').value=v[i]);const ok=possible();document.getElementById('triState').textContent=ok?'삼각형을 만들 수 있습니다.':'삼각형을 만들 수 없습니다.';document.getElementById('construct').disabled=!ok;}ids.forEach(id=>document.getElementById(id).addEventListener('input',draw));document.getElementById('construct').addEventListener('click',()=>{document.getElementById('triExplain').textContent='가장 긴 변을 밑변으로 두고, 양 끝점을 중심으로 나머지 두 변 길이의 원호를 그려 교점을 찾습니다.'});document.getElementById('check').addEventListener('click',()=>{document.getElementById('feedback').textContent=document.querySelector('#guess').value===(possible()?'yes':'no')?'맞았습니다.':'세 변의 합을 비교해 보세요.'});draw();</script></body></html>
