<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>점·선·면과 각의 언어</title>
<style>body{font:17px/1.6 system-ui,sans-serif;max-width:46rem;margin:0 auto;padding:1.25rem;color:#172033}fieldset{border:1px solid #94a3b8;border-radius:12px;padding:1rem}label{display:block;margin-top:1rem}input{width:100%;min-height:2.5rem;accent-color:#1d4ed8}button{min-height:2.75rem;padding:.6rem 1rem}svg{display:block;width:min(100%,24rem);height:auto;margin:1rem auto}:focus-visible{outline:3px solid #b45309;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head>
<body data-lesson="ms12-22-geometry-terms"><main><h1>점·선·면과 각의 언어</h1><p>값을 바꾸고 무엇이 달라지며 무엇이 유지되는지 설명해 보세요.</p><fieldset><legend>직접 조작</legend><svg id="angleSvg" viewBox="0 0 240 150" role="img" aria-label="두 반직선이 이루는 각"><line x1="120" y1="120" x2="210" y2="120" stroke="currentColor"/><line id="ray" x1="120" y1="120" x2="157" y2="55" stroke="currentColor"/><path id="arc" fill="none" stroke="#b45309" stroke-width="3"/><circle cx="120" cy="120" r="4"/></svg><p>이 각은 <strong id="kind" aria-live="polite"></strong>입니다.</p><label for="angle">각의 크기 <output id="angleOut">60°</output></label><input id="angle" type="range" min="0" max="180" value="60" aria-label="각의 크기, 0도에서 180도"><label for="guess">각의 종류</label><select id="guess"><option>예각</option><option>직각</option><option>둔각</option><option>평각</option></select><button id="check" type="button">답 확인</button><p id="feedback" role="status"></p></fieldset><section aria-labelledby="quiz"><h2 id="quiz">생각 확인</h2><p>각의 크기는 변의 길이가 아니라 벌어진 정도로 판단합니다.</p></section><p>기준: 별책 8 성취기준 후보 · 학기 배정 후보 · 교사 검수 대기</p></main><script>const s=document.querySelector('#angle'),o=document.querySelector('#angleOut'),g=document.querySelector('#angleSvg'),k=document.querySelector('#kind');function draw(){const d=+s.value;o.value=d+'°';k.textContent=d<90?'예각':d===90?'직각':d<180?'둔각':'평각';const r=d*Math.PI/180,x=120+75*Math.cos(r),y=120-75*Math.sin(r);g.querySelector('#ray').setAttribute('x2',x);g.querySelector('#ray').setAttribute('y2',y);g.querySelector('#arc').setAttribute('d',`M 175 120 A 55 55 0 0 0 ${120+55*Math.cos(r)} ${120-55*Math.sin(r)}`);}s.addEventListener('input',draw);document.querySelector('#check').addEventListener('click',()=>{const d=+s.value,correct=d<90?'예각':d===90?'직각':d<180?'둔각':'평각';document.querySelector('#feedback').textContent=document.querySelector('#guess').value===correct?'맞았습니다.':'각의 크기와 90도·180도를 비교해 보세요.'});draw();</script></body></html>
