<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>합의 법칙과 곱의 법칙으로 경우 세기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input{width:100%;min-height:2.5rem}button{min-height:2.75rem}svg{width:min(100%,26rem);height:auto}output,strong[aria-live]{color:#1d4ed8}button:focus-visible,input:focus-visible{outline:3px solid #b45309}</style></head><body><main><h1>합의 법칙과 곱의 법칙으로 경우 세기</h1><p>값을 바꾸거나 실험을 반복하며 결과를 관찰하세요.</p><label for="first">첫 단계 선택 수</label><input id="first" type="range" min="1" max="8" value="3"><output id="firstOut">3</output><label for="second">둘째 단계 선택 수</label><input id="second" type="range" min="1" max="8" value="2"><output id="secondOut">2</output><p>전체 조합: <strong id="total" aria-live="polite"></strong></p><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const a=document.querySelector('#first'),b=document.querySelector('#second');function draw(){document.querySelector('#firstOut').value=a.value;document.querySelector('#secondOut').value=b.value;document.querySelector('#total').textContent=Number(a.value)*Number(b.value)+'가지'}a.addEventListener('input',draw);b.addEventListener('input',draw);draw();</script></body></html>
