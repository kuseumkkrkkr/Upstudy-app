<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피타고라스 정리로 길이와 관계 구하기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input{width:100%;min-height:2.5rem}button{min-height:2.75rem}svg{width:min(100%,26rem);height:auto}output,strong[aria-live]{color:#1d4ed8}button:focus-visible,input:focus-visible{outline:3px solid #b45309}</style></head><body><main><h1>피타고라스 정리로 길이와 관계 구하기</h1><p>값을 바꾸거나 실험을 반복하며 결과를 관찰하세요.</p><label for="a">첫 직각변 <output id="aOut">6</output></label><input id="a" type="range" min="1" max="12" value="6"><label for="b">둘째 직각변 <output id="bOut">8</output></label><input id="b" type="range" min="1" max="12" value="8"><svg viewBox="0 0 240 160" role="img" aria-label="직각삼각형 두 직각변과 빗변"><path d="M35 130L195 130 35 30Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M35 113h17v17" fill="none" stroke="#b45309" stroke-width="2"/></svg><p>빗변: <strong id="c" aria-live="polite"></strong></p><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const a=document.querySelector('#a'),b=document.querySelector('#b');function draw(){const x=+a.value,y=+b.value;document.querySelector('#aOut').value=x;document.querySelector('#bOut').value=y;document.querySelector('#c').textContent=Math.sqrt(x*x+y*y).toFixed(2)}a.addEventListener('input',draw);b.addEventListener('input',draw);draw();</script></body></html>
