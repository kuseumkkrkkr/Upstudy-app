<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삼각비로 직접 재기 어려운 길이 추정하기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input{width:100%;min-height:2.5rem}button{min-height:2.75rem}svg{width:min(100%,26rem);height:auto}output,strong[aria-live]{color:#1d4ed8}button:focus-visible,input:focus-visible{outline:3px solid #b45309}</style></head><body><main><h1>삼각비로 직접 재기 어려운 길이 추정하기</h1><p>값을 바꾸거나 실험을 반복하며 결과를 관찰하세요.</p><label for="opposite">맞은편 변 <output id="oppOut">3</output></label><input id="opposite" type="range" min="1" max="12" value="3"><label for="adjacent">이웃한 직각변 <output id="adjOut">4</output></label><input id="adjacent" type="range" min="1" max="12" value="4"><svg viewBox="0 0 220 150" role="img" aria-label="직각삼각형과 예각"><path d="M30 120L190 120 30 35Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M30 103h17v17" fill="none" stroke="#b45309"/></svg><p>tan θ = 맞은편/이웃한 직각변 = <strong id="ratio" aria-live="polite"></strong></p><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>const o=document.querySelector('#opposite'),a=document.querySelector('#adjacent');function draw(){document.querySelector('#oppOut').value=o.value;document.querySelector('#adjOut').value=a.value;document.querySelector('#ratio').textContent=(+o.value/+a.value).toFixed(3)}o.addEventListener('input',draw);a.addEventListener('input',draw);draw();</script></body></html>
