<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실험과 경우의 수로 확률 이해하기</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:48rem;margin:auto;padding:1rem;color:#172033}label{display:block;margin:1rem 0 .25rem}input{width:100%;min-height:2.5rem}button{min-height:2.75rem}svg{width:min(100%,26rem);height:auto}output,strong[aria-live]{color:#1d4ed8}button:focus-visible,input:focus-visible{outline:3px solid #b45309}</style></head><body><main><h1>실험과 경우의 수로 확률 이해하기</h1><p>값을 바꾸거나 실험을 반복하며 결과를 관찰하세요.</p><button id="roll">주사위 굴리기</button><button id="reset">기록 초기화</button><p>시행 횟수: <strong id="trials" aria-live="polite">0</strong></p><p>짝수 결과 비율: <strong id="frequency" aria-live="polite">시행 전</strong></p><p id="last" role="status"></p><p>성취기준 학년군 후보 · 학기 배정 및 교사 검수 대기</p></main><script>let n=0,even=0;const update=()=>{document.querySelector('#trials').textContent=n;document.querySelector('#frequency').textContent=n?(even+'/'+n+' = '+(even/n).toFixed(3)):'시행 전'};document.querySelector('#roll').addEventListener('click',()=>{const d=1+Math.floor(Math.random()*6);n++;if(d%2===0)even++;document.querySelector('#last').textContent='이번 결과: '+d+(d%2===0?' (짝수)':' (홀수)');update()});document.querySelector('#reset').addEventListener('click',()=>{n=0;even=0;document.querySelector('#last').textContent='';update()});</script></body></html>
