<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>기하 개념서 | 벡터 조작 실험실</title>
<style>
:root{color-scheme:light;--ink:#18253b;--muted:#52627a;--line:#d9e1ec;--blue:#2563eb;--teal:#0f766e;--orange:#c2410c;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Malgun Gothic",sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}h1{font-size:1.5rem;margin:.1em 0}.muted{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}.controls label{display:flex;gap:7px;align-items:center}.controls input{width:130px;accent-color:var(--blue)}button,select{border:1px solid #aebbd0;border-radius:10px;background:white;color:var(--ink);padding:9px 12px;font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.canvas{width:100%;height:auto;background:#fbfdff;border:1px solid var(--line);border-radius:12px}.canvas text{font:13px system-ui,"Malgun Gothic",sans-serif;fill:var(--ink)}.formula{font-weight:700;font-size:1.2rem}.step{min-height:2em}.quiz{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.quiz input{max-width:100px;padding:8px;border:1px solid #aebbd0;border-radius:8px;font:inherit}.feedback{min-height:2em;font-weight:650}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:650px){.wrap{padding:12px}.card{padding:14px}.controls label{width:100%;flex-wrap:wrap}.controls input{flex:1;min-width:105px}.canvas text{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="wrap">
<header class="card"><p class="muted">기하 개념서 · 평면벡터</p><h1>화살표를 이어 붙여 계산을 눈으로 보기</h1><p>벡터는 크기와 방향을 함께 나타냅니다. 성분을 움직여 덧셈·뺄셈·실수배의 규칙을 직접 탐색해 보세요. 화살표 그림은 계산을 돕고, 일반적인 성질은 좌표 계산으로 설명합니다.</p></header>
<section class="card"><h2>벡터 조작 도구</h2><div class="controls"><label for="op">연산<select id="op"><option value="add">u + v</option><option value="sub">u − v</option><option value="scale">αu</option></select></label><label for="ux">uₓ <input id="ux" type="range" min="-4" max="4" step="1" value="3"><output id="uxo">3</output></label><label for="uy">uᵧ <input id="uy" type="range" min="-4" max="4" step="1" value="1"><output id="uyo">1</output></label><label for="vx">vₓ <input id="vx" type="range" min="-4" max="4" step="1" value="1"><output id="vxo">1</output></label><label for="vy">vᵧ <input id="vy" type="range" min="-4" max="4" step="1" value="2"><output id="vyo">2</output></label><label for="alpha">α <input id="alpha" type="range" min="-2" max="2" step="0.5" value="2"><output id="ao">2</output></label></div>
<p id="equation" class="formula" aria-live="polite"></p><svg class="canvas" viewBox="0 0 760 430" role="img" aria-labelledby="plot-title plot-desc"><title id="plot-title">두 벡터와 연산 결과</title><desc id="plot-desc">격자 위에 벡터 u, 벡터 v, 연산 결과를 서로 다른 선 모양과 글자로 표시합니다.</desc><defs><marker id="arrowU" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker><marker id="arrowV" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c2410c"/></marker><marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/></marker></defs><g id="grid"></g><g id="arrows"></g><text x="700" y="410">x</text><text x="390" y="22">y</text></svg><p id="description" class="muted" aria-live="polite"></p>
<div class="controls"><button id="prev" type="button">이전 단계</button><button id="next" type="button">다음 단계</button><button id="play" type="button">단계 보기</button><button id="reset" type="button">기본 벡터</button></div><p id="step-text" class="step" aria-live="polite"></p></section>
<section class="card"><h2>도구 퀴즈</h2><p id="question"></p><div class="quiz"><label for="answer-x">x성분 <input id="answer-x" type="number" step="0.5"></label><label for="answer-y">y성분 <input id="answer-y" type="number" step="0.5"></label><button id="check" type="button">답 확인</button></div><p id="feedback" class="feedback" aria-live="polite"></p><button id="hint" type="button">Socratic 힌트</button><p id="hint-text" class="muted" aria-live="polite">정답을 계산한 뒤 힌트를 열어 보세요.</p><p class="muted">시범은 입력을 저장하지 않습니다. 교육과정 판본·코드 대조와 교사 검수는 진행 전입니다.</p></section>
</main><script>
(()=>{'use strict';const ids=['ux','uy','vx','vy','alpha'],$=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg',cx=380,cy=212,s=23;let step=0,timer=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)');function line(x1,y1,x2,y2,color,dash='',label=''){const a=document.createElementNS(ns,'line');for(const[k,v]of Object.entries({x1,y1,x2,y2,stroke:color,'stroke-width':3,'stroke-dasharray':dash,'marker-end':`url(#${color==='#2563eb'?'arrowU':color==='#c2410c'?'arrowV':'arrowR'})`}))a.setAttribute(k,String(v));$('arrows').append(a);if(label){const t=document.createElementNS(ns,'text');t.setAttribute('x',String(x2+7));t.setAttribute('y',String(y2-6));t.textContent=label;$('arrows').append(t)}}function point(x,y){return[cx+x*s,cy-y*s]}function renderGrid(){const g=$('grid');for(let i=-9;i<=9;i++){let l=document.createElementNS(ns,'line');l.setAttribute('x1',String(cx+i*s));l.setAttribute('x2',String(cx+i*s));l.setAttribute('y1','35');l.setAttribute('y2','390');l.setAttribute('stroke',i===0?'#728197':'#e5ebf3');l.setAttribute('stroke-width',i===0?'1.5':'1');g.append(l)}for(let j=-8;j<=8;j++){let l=document.createElementNS(ns,'line');l.setAttribute('x1','55');l.setAttribute('x2','705');l.setAttribute('y1',String(cy-j*s));l.setAttribute('y2',String(cy-j*s));l.setAttribute('stroke',j===0?'#728197':'#e5ebf3');l.setAttribute('stroke-width',j===0?'1.5':'1');g.append(l)}}function render(){const [ux,uy,vx,vy,a]=ids.map(i=>Number($(i).value));for(const id of ids)$(id==='alpha'?'ao':id+'o').value=Number($(id).value);const op=$('op').value;let rx,ry,lines=[],formula='',desc='';if(op==='add'){rx=ux+vx;ry=uy+vy;lines=[[0,0,ux,uy,'#2563eb','','u'],[ux,uy,ux+vx,uy+vy,'#c2410c','','v를 u 끝에 연결'],[0,0,rx,ry,'#0f766e','7 4','u+v']];formula=`u=(${ux}, ${uy}), v=(${vx}, ${vy})  →  u+v=(${rx}, ${ry})`;desc='파랑 u를 먼저 그리고 주황 v를 u의 끝에 이어 붙였습니다. 초록 점선이 처음부터 마지막까지의 합입니다.'}else if(op==='sub'){rx=ux-vx;ry=uy-vy;lines=[[0,0,ux,uy,'#2563eb','','u'],[ux,uy,ux-vx,uy-vy,'#c2410c','5 4','−v'],[0,0,rx,ry,'#0f766e','7 4','u−v']];formula=`u=(${ux}, ${uy}), v=(${vx}, ${vy})  →  u−v=(${rx}, ${ry})`;desc='주황 화살표는 v와 반대 방향인 −v입니다. u 끝에서 −v를 이어 붙이면 초록 결과가 됩니다.'}else{rx=a*ux;ry=a*uy;lines=[[0,0,ux,uy,'#2563eb','','u'],[0,0,rx,ry,'#0f766e','7 4',`${a}u`]];formula=`u=(${ux}, ${uy}), α=${a}  →  αu=(${rx}, ${ry})`;desc=a===0?'α=0이면 방향이 정해지지 않는 영벡터 (0,0)입니다.':a<0?'α<0이므로 결과는 u와 반대 방향이며 길이는 |α|배입니다.':'α>0이므로 결과는 u와 같은 방향이며 길이는 α배입니다.'}$('equation').textContent=formula;$('description').textContent=desc;$('arrows').replaceChildren();const visible=step===0?lines.slice(-1):step===1?lines.slice(0,1):step===2?lines.slice(0,2):lines;for(const [x1,y1,x2,y2,c,d,l] of visible){const A=point(x1,y1),B=point(x2,y2);line(A[0],A[1],B[0],B[1],c,d,l)}$('step-text').textContent=`${step+1}단계 / 4 · ${['결과 벡터를 먼저 예측하세요.','u의 이동을 그렸습니다.','두 번째 화살표를 이어 붙였습니다.','처음과 끝을 잇는 결과 성분을 확인하세요.'][step]}`;const qx=op==='add'?ux+vx:op==='sub'?ux-vx:a*ux,qy=op==='add'?uy+vy:op==='sub'?uy-vy:a*uy;$('question').textContent=`현재 도구 설정에서 결과 벡터의 성분은? (${op==='scale'?'αu':`u${op==='add'?'+':'−'}v`})`;$('check').dataset.x=String(qx);$('check').dataset.y=String(qy);$('feedback').textContent=''}renderGrid();ids.forEach(id=>$(id).addEventListener('input',()=>{step=3;render()}));$('op').addEventListener('change',()=>{step=0;render()});$('prev').addEventListener('click',()=>{step=(step+3)%4;render()});$('next').addEventListener('click',()=>{step=(step+1)%4;render()});$('play').addEventListener('click',()=>{if(timer)clearInterval(timer);if(reduce.matches){$('step-text').textContent='움직임 감소 설정: 자동 재생 대신 단계 버튼으로 직접 이동하세요.';return}step=0;render();timer=setInterval(()=>{if(step>=3){clearInterval(timer);timer=0;return}step++;render()},650)});$('reset').addEventListener('click',()=>{[3,1,1,2,2].forEach((v,i)=>$(ids[i]).value=String(v));$('op').value='add';step=0;render()});$('check').addEventListener('click',()=>{const x=Number($('answer-x').value),y=Number($('answer-y').value),ok=$('answer-x').value!==''&&$('answer-y').value!==''&&Math.abs(x-Number($('check').dataset.x))<1e-9&&Math.abs(y-Number($('check').dataset.y))<1e-9;$('feedback').textContent=ok?'정답입니다. 성분 계산과 그림의 끝점이 일치하는지 확인하세요.':'성분을 다시 계산해 보세요. 뺄셈은 성분별 차, 실수배는 두 성분에 같은 계수를 곱합니다.'});$('hint').addEventListener('click',()=>{$('hint-text').textContent=$('op').value==='add'?'x성분끼리 더하고 y성분끼리 더하세요. 화살표를 머리-꼬리로 잇는 것과 같은 계산입니다.':$('op').value==='sub'?'u−v=u+(−v)입니다. v의 두 성분을 각각 빼세요.':'계수 α를 벡터의 각 성분에 곱하세요. 계수 부호가 방향을 정합니다.'});render()})();
</script></body></html>
