<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIFlow 콘텐츠 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f0f2;color:#09090b;font:16px/1.6 sans-serif}main{max-width:1080px;margin:auto;padding:24px}header{border-bottom:2px solid #111113;margin-bottom:24px}section{background:#fdfdfe;padding:24px;margin-bottom:20px}h1{font-size:28px;margin:8px 0}h2{font-size:22px;margin:0 0 16px}p{color:#71717a}label{display:block;margin-bottom:14px}input,select,textarea,button{font:inherit;min-height:44px;border:1px solid #bdbdc3;border-radius:0;padding:10px}input,textarea{display:block;width:100%;background:#fff}button{cursor:pointer;background:#111113;color:#fff}button.secondary{background:#fff;color:#111113}button:disabled{opacity:.45;cursor:wait}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}.status{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f3f3f5}ul{list-style:none;padding:0}li{border-top:1px solid #ddd;padding:16px 0;display:flex;align-items:center;gap:12px}li span{flex:1;overflow-wrap:anywhere}small{display:block;color:#71717a}textarea{min-height:130px}[hidden]{display:none!important}
</style><script src="/admin/app.js" defer></script></head>
<body><main><header><small>내부 테스트 · 콘텐츠 관리</small><h1>코스 · 시험지 · 문제집</h1></header>
<section id="session"><h2>관리자 연결</h2><p>학생 계정 DB와 분리된 관리자 전용 로그인입니다. 관리자 계정과 전용 API 키가 모두 필요합니다. 인증 정보는 이 탭의 메모리에만 보관하며 새로고침하면 지워집니다.</p>
<form id="login"><div class="row"><label>아이디<input id="username" autocomplete="username" required value="admin" maxlength="16"></label><label>비밀번호<input id="password" type="password" autocomplete="off" required></label></div><label>관리자 API 키<input id="apiKey" type="password" autocomplete="off" required maxlength="512"></label><button>연결</button></form><button id="logout" class="secondary" hidden>연결 해제</button></section>
<div id="status" role="status" aria-live="polite" class="status">관리자 연결 전입니다.</div>
<section id="workspace" hidden><h2>자료 목록</h2><div class="row"><label>종류<select id="kindFilter"><option value="">전체</option><option value="course">코스</option><option value="exam">시험지</option><option value="problem_set">문제집</option></select></label><label>검색<input id="search" type="search" placeholder="제목 또는 ID"></label><button id="reload">새로고침</button></div><ul id="items"></ul></section>
<section id="editor" hidden><h2>자료 추가 · 정보 변경</h2><p>기존 문항 ID를 연결합니다. 공개한 문항 구성을 바꾸려면 새 자료 ID를 사용하세요. 삭제는 목록에서 숨기는 보관 처리이며 보유 학생의 기록은 유지합니다.</p>
<form id="content"><div class="row"><label>자료 ID<input id="contentId" required pattern="[a-z0-9][a-z0-9-]{2,119}" maxlength="120" placeholder="admin-math-exam-01"></label><label>종류<select id="kind"><option value="course">코스</option><option value="exam">시험지</option><option value="problem_set">문제집</option></select></label></div>
<label>제목<input id="title" required maxlength="160"></label><label>설명<textarea id="description" maxlength="2000"></textarea></label><div class="row"><label>학년·범위<input id="grade" value="수학" required maxlength="40"></label><label>난이도<input id="difficulty" value="기본" required maxlength="40"></label></div><label>문항 ID (한 줄에 하나, 최대 50개)<textarea id="questions" required></textarea></label><div class="row"><button>저장 · 보관 해제</button><button id="new" type="button" class="secondary">새 자료 작성</button></div></form></section></main>
<dialog id="archiveConfirm" aria-labelledby="archiveHeading"><form method="dialog"><h2 id="archiveHeading">자료 보관 확인</h2><p id="archiveMessage"></p><div class="row"><button value="cancel" class="secondary" autofocus>취소</button><button value="archive">공개 목록에서 숨기기</button></div></form></dialog>
</body></html>
